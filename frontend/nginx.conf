server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (Angular Router maneja la navegacion en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.json se regenera en cada arranque del contenedor (ver
    # docker-entrypoint.sh), por eso nunca debe cachearse.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
